# 대시보드만 컨테이너로 띄운다. 점검 대상은 각자 호스트에서 돌린다.
#
#     docker compose up --build        # http://127.0.0.1:8899/
#
# 호스트에서 돌고 있는 대상은 화면에서 host.docker.internal 로 지정한다.
# 예) Juice Shop  http://host.docker.internal:3000/
#     reflection_lab  http://host.docker.internal:8000/
services:
  dashboard:
    build: .
    # 127.0.0.1 로 묶는다. 이 화면은 누구든 Run 을 시작할 수 있으므로 같은 네트워크의
    # 다른 사람에게 열리면 안 된다. 여기를 "8899:8899" 로 바꾸면 LAN 전체에 열린다.
    ports:
      - "127.0.0.1:8899:8899"
    # Docker Desktop(mac/windows)에는 이미 있지만 Linux 에서는 이 줄이 있어야
    # host.docker.internal 이 호스트를 가리킨다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # src·scripts·web 을 읽기 전용으로 물린다. UI 를 고칠 때마다 이미지를 다시
    # 만들 필요가 없고, 컨테이너가 코드를 바꿀 수는 없다.
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./web:/app/web:ro
    command: >
      python scripts/serve_dashboard.py
      --bind 0.0.0.0
      --allow-host host.docker.internal
      --target http://host.docker.internal:3000/
      --budget 60
    # LLM 엔진을 쓸 때만 필요하다. 없으면 화면에서 해당 엔진이 "(키 없음)" 으로 잠긴다.
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    restart: "no"
